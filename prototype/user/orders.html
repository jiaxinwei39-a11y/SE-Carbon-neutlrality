<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的订单 · 绿行积分</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span class="dots"><span></span><span></span><span></span></span></div>

      <div class="appbar">
        <a class="icon-btn" href="mall.html">←</a>
        <h1 style="margin-left:4px">我的订单</h1>
        <div class="spacer"></div>
      </div>

      <div class="content">
        <div class="seg" id="filter">
          <button class="on" data-value="ALL">全部</button>
          <button data-value="CREATED">待处理</button>
          <button data-value="FULFILLED">已履约</button>
          <button data-value="CANCELLED">已取消</button>
        </div>

        <div id="orders"></div>

        <div class="tiny" style="margin:18px 4px;line-height:1.7">
          订单状态：待处理 →（管理员履约）已履约；待处理可取消，取消后积分冲正、库存归还。
        </div>
      </div>

      <nav class="tabbar" data-active="me"></nav>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
  function render(status) {
    const rows = MOCK.orders.filter(o => status === 'ALL' || o.status === status);
    const box = document.getElementById('orders');
    if (!rows.length) { box.innerHTML = '<div class="card empty">暂无相关订单</div>'; return; }
    box.innerHTML = rows.map(o => `
      <div class="card" style="padding:14px 16px">
        <div class="row between">
          <div class="row gap10">
            <div class="thumb">${o.icon}</div>
            <div class="col">
              <strong style="font-size:14px">${o.product}</strong>
              <span class="tiny">${o.time} · 数量 ${o.qty}</span>
            </div>
          </div>
          <div style="text-align:right">
            ${badge(o.statusName, o.status)}
            <div class="tiny" style="margin-top:6px">${o.status === 'CANCELLED'
              ? `<span style="color:var(--green-600)">+${fmt(o.points)} 分 · 已退还</span>`
              : `-${fmt(o.points)} 分`}</div>
          </div>
        </div>
        <div class="row between" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)">
          <span class="tiny">订单号 ${o.id}</span>
          ${o.status === 'CREATED' ? '<button class="btn btn-ghost btn-sm" onclick="cancelOrder(this)">取消订单</button>' : ''}
        </div>
      </div>`).join('');
  }
  function cancelOrder(btn) {
    const card = btn.closest('.card');
    btn.closest('.row').innerHTML = '<span class="tiny" style="color:var(--amber-600)">取消处理中，积分将原路返还</span>';
    toast('订单已取消，积分已返还');
    setTimeout(() => {
      const b = card.querySelector('.badge');
      if (b) { b.className = 'badge badge-gray'; b.textContent = '已取消'; }
      const amt = card.querySelector('.row.between > div[style*="text-align"] .tiny');
      if (amt && !amt.textContent.includes('退还')) {
        const n = amt.textContent.replace(/[^0-9]/g, '');
        amt.innerHTML = `<span style="color:var(--green-600)">+${n} 分 · 已退还</span>`;
      }
    }, 600);
  }
  bindSeg('#filter', render);
  render('ALL');
</script>
</body>
</html>
