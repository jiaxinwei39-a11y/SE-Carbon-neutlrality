<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程记录 · 绿行积分</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span class="dots"><span></span><span></span><span></span></span></div>

      <div class="appbar">
        <h1>行程记录</h1>
        <div class="spacer"></div>
        <a class="icon-btn" href="home.html#report" title="上报">➕</a>
      </div>

      <div class="content">
        <div class="sum-card">
          <div class="item"><span class="k">本月行程</span><span class="v">18<small>次</small></span></div>
          <div class="item"><span class="k">本月减排</span><span class="v">12.4<small>kg</small></span></div>
          <div class="item"><span class="k">本月积分</span><span class="v">124<small>分</small></span></div>
        </div>

        <div class="seg" id="filter">
          <button class="on" data-value="ALL">全部</button>
          <button data-value="BUS">公交</button>
          <button data-value="SUBWAY">地铁</button>
          <button data-value="BIKE">骑行</button>
          <button data-value="WALK">步行</button>
        </div>

        <div class="section-title"><h2>11 月</h2><span class="tiny">共 5 条</span></div>
        <div class="card flush"><div class="list" id="tripList" style="padding:0 16px"></div></div>
      </div>

      <nav class="tabbar" data-active="trip"></nav>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
  function render(mode) {
    const rows = MOCK.trips.filter(t => mode === 'ALL' || t.mode === mode);
    const box = document.getElementById('tripList');
    if (!rows.length) { box.innerHTML = '<div class="empty">该分类下暂无行程</div>'; return; }
    box.innerHTML = rows.map(t => `
      <div class="list-item">
        <div class="thumb">${t.icon}</div>
        <div class="body">
          <div class="title">${t.modeName} · ${t.distance} km</div>
          <div class="meta">${t.date} · 减排 ${t.reduction} kgCO₂e</div>
          <div class="meta">单号 ${t.id}</div>
        </div>
        <div class="amount">${t.points > 0 ? '+' + t.points : '0'}</div>
      </div>`).join('');
  }
  bindSeg('#filter', render);
  render('ALL');
</script>
</body>
</html>
