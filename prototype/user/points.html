<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>积分明细 · 绿行积分</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span class="dots"><span></span><span></span><span></span></span></div>

      <div class="appbar">
        <h1>积分</h1>
        <div class="spacer"></div>
        <a class="icon-btn" href="mall.html" title="去兑换">🎁</a>
      </div>

      <div class="content">
        <div class="hero">
          <div class="label">当前可用积分</div>
          <div class="amount">1,280<small>分</small></div>
          <div class="foot">
            <span>累计获得 <strong>3,450</strong></span>
            <span>累计兑换 <strong>2,170</strong></span>
          </div>
        </div>

        <div class="section-title"><h2>积分明细</h2><span class="tiny">近 30 天</span></div>
        <div class="card flush"><div class="list" style="padding:0 16px" id="ledger"></div></div>

        <div class="tiny" style="margin:16px 4px;line-height:1.7">
          · 积分以「积分流水」为唯一依据，余额与流水始终对账一致<br>
          · 兑换失败或取消会产生冲正记录，不会出现凭空增减<br>
          · 积分为整数分，减排量按 0.01 kg 四舍五入后计算
        </div>
      </div>

      <nav class="tabbar" data-active="points"></nav>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
  const LABEL = {
    TRIP_GRANT: ['出行奖励', 'green'],
    REDEMPTION_DEBIT: ['兑换扣减', 'ink'],
    REDEMPTION_REVERSAL: ['冲正返还', 'amber'],
    ADMIN_ADJUST: ['人工调整', 'amber']
  };
  document.getElementById('ledger').innerHTML = MOCK.ledger.map(r => {
    const [name, tone] = LABEL[r.type] || ['其他', 'ink'];
    return `
      <div class="list-item">
        <div class="thumb" style="background:${tone === 'green' ? '#ecfdf5' : tone === 'amber' ? '#fffbeb' : '#f1f5f9'}">${tone === 'green' ? '🌿' : tone === 'amber' ? '↩️' : '🎁'}</div>
        <div class="body">
          <div class="title">${r.title}</div>
          <div class="meta">${r.time} · ${name}</div>
        </div>
        <div class="col" style="align-items:flex-end">
          <div class="amount" style="color:${r.change > 0 ? 'var(--green-600)' : 'var(--ink-700)'}">${r.change > 0 ? '+' : ''}${r.change}</div>
          <div class="tiny">余额 ${fmt(r.balance)}</div>
        </div>
      </div>`;
  }).join('');
</script>
</body>
</html>
