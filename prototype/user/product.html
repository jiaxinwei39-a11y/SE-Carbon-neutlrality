<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>礼品详情 · 绿行积分</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span class="dots"><span></span><span></span><span></span></span></div>

      <div class="appbar">
        <a class="icon-btn" href="mall.html">←</a>
        <div class="spacer"></div>
        <a class="icon-btn" href="orders.html" title="订单">🧾</a>
      </div>

      <div class="content" style="padding-top:8px">
        <div class="product-hero"><span id="emoji">☕</span></div>

        <div class="card" style="margin-top:16px">
          <div class="row between">
            <h2 id="name" style="margin:0;font-size:18px">咖啡兑换券</h2>
            <div style="text-align:right">
              <div class="price-big" id="price">300<small>分</small></div>
            </div>
          </div>
          <div class="tiny" style="margin-top:6px" id="stock">库存 42 · 每个账号每日限兑 2 次</div>
          <p style="color:var(--ink-600);font-size:13.5px;line-height:1.75;margin:14px 0 0" id="desc"></p>
        </div>

        <div class="card">
          <div class="section-title" style="margin:0 0 10px"><h2 style="font-size:14px">兑换须知</h2></div>
          <ul class="rules">
            <li>兑换成功后积分立即扣减，兑换券在「我的订单」中查看。</li>
            <li>库存不足或积分不足时无法兑换，页面会给出明确原因。</li>
            <li>订单取消后积分原路冲正，库存同步归还。</li>
            <li>同一请求重复提交只生成一笔订单（幂等保护）。</li>
          </ul>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="col">
          <span class="tiny">我的积分</span>
          <strong style="font-size:16px">1,280</strong>
        </div>
        <button class="btn btn-primary" style="flex:1" onclick="openSheet()">立即兑换</button>
      </div>

      <div class="sheet-mask" id="mask" onclick="closeSheet()"></div>
      <div class="sheet" id="sheet">
        <div class="handle"></div>
        <h3 style="margin:0 0 4px;font-size:17px">确认兑换</h3>
        <p class="tiny" style="margin:0 0 16px">兑换后将扣减积分，操作不可撤销（可取消订单返还）</p>
        <div class="confirm-row"><span>礼品</span><strong id="sName">—</strong></div>
        <div class="confirm-row"><span>扣减积分</span><strong id="sPoints" style="color:var(--green-600)">—</strong></div>
        <div class="confirm-row"><span>兑换后余额</span><strong id="sLeft">—</strong></div>
        <div class="row gap10" style="margin-top:18px">
          <button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">再想想</button>
          <button class="btn btn-primary" style="flex:1" onclick="confirmRedeem()">确认兑换</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id') || 'P01';
  const p = MOCK.products.find(x => x.id === id) || MOCK.products[0];

  document.getElementById('emoji').textContent = p.icon;
  document.getElementById('name').textContent = p.name;
  document.getElementById('price').innerHTML = fmt(p.points) + '<small>分</small>';
  document.getElementById('stock').textContent = `库存 ${p.stock} · 每个账号每日限兑 2 次`;
  document.getElementById('desc').textContent = p.desc;

  const canRedeem = p.stock > 0 && MOCK.user.points >= p.points;
  const btn = document.querySelector('.bottom-bar .btn');
  if (!canRedeem) {
    btn.disabled = true;
    btn.textContent = p.stock === 0 ? '已兑完' : '积分不足';
  }

  function openSheet() {
    if (!canRedeem) return;
    document.getElementById('sName').textContent = p.name;
    document.getElementById('sPoints').textContent = '-' + fmt(p.points);
    document.getElementById('sLeft').textContent = fmt(MOCK.user.points - p.points) + ' 分';
    document.getElementById('mask').classList.add('on');
    document.getElementById('sheet').classList.add('on');
  }
  function closeSheet() {
    document.getElementById('mask').classList.remove('on');
    document.getElementById('sheet').classList.remove('on');
  }
  function confirmRedeem() {
    closeSheet();
    toast('兑换成功，可在「我的订单」查看');
    setTimeout(() => location.href = 'orders.html', 900);
  }
</script>
</body>
</html>
