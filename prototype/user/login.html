<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 绿行积分</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .login-hero { text-align: center; padding: 40px 0 26px; }
  .logo-big {
    width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 16px;
    background: linear-gradient(140deg, #34d399, #047857);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; box-shadow: 0 14px 30px rgba(5,150,105,.32);
  }
  .login-hero h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.4px; }
  .login-hero p { margin: 0; color: var(--ink-500); font-size: 13px; }
  .aux { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 2px 20px; }
  .aux a { color: var(--green-600); }
  .demo {
    margin-top: 18px; background: var(--green-50); border: 1px dashed #a7f3d0;
    border-radius: 12px; padding: 12px 14px; font-size: 12px; color: var(--green-700); line-height: 1.6;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span class="dots"><span></span><span></span><span></span></span></div>

      <div class="content" style="padding: 0 26px;">
        <div class="login-hero">
          <div class="logo-big">🌿</div>
          <h1>绿行积分</h1>
          <p>让每一次出行，都算「树」</p>
        </div>

        <form onsubmit="event.preventDefault(); location.href='home.html';">
          <div class="field">
            <label for="u">用户名</label>
            <input id="u" value="shengyang" autocomplete="username" placeholder="请输入用户名">
          </div>
          <div class="field">
            <label for="p">密码</label>
            <input id="p" type="password" value="123456" autocomplete="current-password" placeholder="请输入密码">
            <div class="hint">密码只用于登录，系统仅保存带盐哈希</div>
          </div>

          <div class="aux">
            <span style="color:var(--ink-400)">停用账号无法登录</span>
            <a href="register.html">注册新账号</a>
          </div>

          <button class="btn btn-primary btn-block" type="submit">登 录</button>
        </form>

        <div class="demo">
          <strong>演示账号</strong><br>
          普通用户 shengyang / 123456<br>
          运营管理员 admin / 123456
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
