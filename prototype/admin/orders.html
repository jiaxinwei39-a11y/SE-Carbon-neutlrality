<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单处理 · 绿行积分管理端</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="admin">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>绿行积分 · 运营端</div>
    <nav>
      <a href="stats.html">📊 运营概览</a>
      <a href="rules.html">⚙️ 碳核算规则</a>
      <a href="products.html">🎁 礼品管理</a>
      <a class="active" href="orders.html">🧾 订单处理</a>
    </nav>
    <div class="side-foot"><div class="tiny">管理员 admin</div><a class="tiny" href="../user/login.html">退出</a></div>
  </aside>

  <main class="admin-main">
    <header class="admin-head">
      <div>
        <h1>订单处理</h1>
        <p class="tiny">待处理 →（履约）已履约；取消需在履约前操作，积分与库存同步冲正</p>
      </div>
      <div class="row gap10">
        <span class="badge badge-amber">待处理 2</span>
        <span class="badge badge-green">已履约 1</span>
        <span class="badge badge-gray">已取消 1</span>
      </div>
    </header>

    <div class="toolbar">
      <select class="select" id="filter" onchange="render(this.value)">
        <option value="ALL">全部状态</option>
        <option value="CREATED">待处理</option>
        <option value="FULFILLED">已履约</option>
        <option value="CANCELLED">已取消</option>
      </select>
      <input class="input" placeholder="搜索订单号 / 用户名…" style="max-width:240px">
      <span class="tiny" style="margin-left:auto">共 4 笔</span>
    </div>

    <section class="panel">
      <table class="table">
        <thead>
          <tr><th>订单号</th><th>用户</th><th>礼品</th><th>扣减积分</th><th>状态</th><th>下单时间</th><th>操作</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <div class="notice" style="margin-top:16px">
      <strong>为什么不能重复处理：</strong>履约与取消都带状态机校验（仅 CREATED 可流转），并发下用乐观锁版本号防止重复扣减。
    </div>
  </main>
</div>
<script src="../assets/app.js"></script>
<script>
  function render(status) {
    const rows = MOCK.adminOrders.filter(o => status === 'ALL' || o.status === status);
    document.getElementById('rows').innerHTML = rows.map(o => `
      <tr>
        <td class="mono">${o.id}</td>
        <td>${o.user}</td>
        <td>${o.product}</td>
        <td>${fmt(o.points)}</td>
        <td>${badge(o.statusName, o.status)}</td>
        <td class="tiny">${o.time}</td>
        <td>
          ${o.status === 'CREATED'
            ? `<button class="btn btn-primary btn-sm" onclick="act(this,'已履约','green')">履约</button>
               <button class="btn btn-ghost btn-sm" onclick="act(this,'已取消','gray')">取消</button>`
            : '<span class="tiny">—</span>'}
        </td>
      </tr>`).join('') || '<tr><td colspan="7" class="empty">该状态下暂无订单</td></tr>';
  }
  function act(btn, text, tone) {
    const tr = btn.closest('tr');
    const badgeCell = tr.children[4];
    badgeCell.innerHTML = `<span class="badge badge-${tone}">${text}</span>`;
    tr.children[6].innerHTML = '<span class="tiny">—</span>';
    toast('订单' + text);
  }
  render('ALL');
</script>
</body>
</html>
