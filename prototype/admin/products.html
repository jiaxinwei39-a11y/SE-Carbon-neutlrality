<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>礼品管理 · 绿行积分管理端</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="admin">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>绿行积分 · 运营端</div>
    <nav>
      <a href="stats.html">📊 运营概览</a>
      <a href="rules.html">⚙️ 碳核算规则</a>
      <a class="active" href="products.html">🎁 礼品管理</a>
      <a href="orders.html">🧾 订单处理</a>
    </nav>
    <div class="side-foot"><div class="tiny">管理员 admin</div><a class="tiny" href="../user/login.html">退出</a></div>
  </aside>

  <main class="admin-main">
    <header class="admin-head">
      <div>
        <h1>礼品管理</h1>
        <p class="tiny">上下架与库存变更立即对用户端生效；库存为 0 时自动显示「已兑完」</p>
      </div>
      <button class="btn btn-primary btn-sm" onclick="toast('打开新增礼品表单（演示）')">＋ 新增礼品</button>
    </header>

    <div class="toolbar">
      <input class="input" placeholder="搜索礼品名称…" style="max-width:260px">
      <select class="select"><option>全部状态</option><option>上架中</option><option>已下架</option></select>
      <span class="tiny" style="margin-left:auto">共 6 件 · 库存告警 1 件</span>
    </div>

    <section class="panel">
      <table class="table">
        <thead>
          <tr><th>礼品</th><th>所需积分</th><th>库存</th><th>已兑换</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <div class="notice" style="margin-top:16px">
      <strong>库存与积分的一致性：</strong>兑换在单个事务内完成「扣积分 → 减库存 → 写流水 → 建订单」，任一步失败整体回滚；取消订单则原路冲正。
    </div>
  </main>
</div>
<script src="../assets/app.js"></script>
<script>
  const extra = { P01: 128, P02: 46, P03: 33, P04: 0, P05: 12, P06: 8 };
  document.getElementById('rows').innerHTML = MOCK.products.map(p => `
    <tr>
      <td><span style="font-size:18px;margin-right:8px">${p.icon}</span><strong>${p.name}</strong><div class="tiny">${p.desc}</div></td>
      <td>${fmt(p.points)} 分</td>
      <td>${p.stock === 0 ? '<span class="badge badge-red">0</span>' : p.stock < 10 ? `<span class="badge badge-amber">${p.stock} 偏低</span>` : p.stock}</td>
      <td class="tiny">${extra[p.id] || 0}</td>
      <td>${p.stock > 0 ? '<span class="badge badge-green">上架中</span>' : '<span class="badge badge-gray">缺货下架</span>'}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="toast('已打开编辑（演示）')">编辑</button></td>
    </tr>`).join('');
</script>
</body>
</html>
