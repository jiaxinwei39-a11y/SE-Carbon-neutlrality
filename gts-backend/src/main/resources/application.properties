server.port=8080
server.servlet.context-path=/api

spring.application.name=gts-backend

# 数据源：本机 MySQL，库名 gts（由 db/schema.sql 创建）
# 凭据不写进仓库 —— #9 验收条件明确要求"密码和凭据不入库仓文件"。
# 启动前先设置环境变量（只需设一次，退出终端失效）：
#   PowerShell:  $env:GTS_DB_PASSWORD="你的 MySQL 密码"
#   CMD:         set GTS_DB_PASSWORD=你的 MySQL 密码
#   IDEA:        Run Configuration → Environment variables 里加 GTS_DB_PASSWORD
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gts?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${GTS_DB_USER:root}
spring.datasource.password=${GTS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# 会话有效期（小时）
gts.session.hours=168

# 测试钩子（默认关闭，生产行为不受影响）
# 插入前延迟，用来让并发请求都完成"前置查重"再插入，制造真实的并发冲突
gts.test.insert-delay-ms=0
# 行程写入后强制失败，用来验证整笔事务回滚（TC-13 故障注入）
gts.test.fail-after-trip=false

# 日志：开发期打开 SQL 便于讲清楚每条语句
logging.level.com.gts=DEBUG
