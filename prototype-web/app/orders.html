<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的订单 · 绿行积分</title>
<link rel="stylesheet" href="../assets/web.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="mark">🌿</span> 绿行积分</div>
    <nav class="nav">
      <a href="index.html">首页</a><a href="trips.html">行程</a>
      <a href="points.html">积分</a><a href="mall.html">商城</a><a class="on" href="orders.html">订单</a>
    </nav>
    <div class="right">
      <div class="pill">🌿 <span class="num">1,280</span> 分</div>
      <div class="avatar">生</div>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>我的订单</h1>
      <p>待处理订单可自行取消；已履约与已取消的订单不可再变更</p>
    </div>
  </div>

  <div class="filters">
    <div class="segs" id="seg">
      <button class="on" data-value="ALL">全部</button>
      <button data-value="CREATED">待处理</button>
      <button data-value="FULFILLED">已履约</button>
      <button data-value="CANCELLED">已取消</button>
    </div>
    <div class="spacer"></div>
    <span class="hint">共 4 笔</span>
  </div>

  <div class="card tight">
    <table class="table">
      <thead>
        <tr>
          <th style="width:190px">订单号</th><th>礼品</th>
          <th class="r" style="width:80px">数量</th><th class="r" style="width:110px">积分</th>
          <th style="width:120px">状态</th><th style="width:150px">下单时间</th>
          <th style="width:120px">操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="hint" style="margin:16px 2px">
    订单状态：待处理 →（管理员履约）已履约；待处理可取消，取消后积分冲正并显示「+N 分 · 已退还」。
  </p>
</main>

<div class="mask" id="mask" onclick="closeModal('cancel')"></div>
<div class="modal" id="cancel">
  <h3>取消订单</h3>
  <p class="m-sub">取消后积分将立即退回，礼品库存同步归还，该操作不可撤销。</p>
  <div class="confirm-row"><span>订单号</span><b class="mono" id="cancelId">—</b></div>
  <div class="confirm-row" style="border-bottom:0"><span>退还积分</span><b class="num" style="color:var(--green-600)" id="cancelPts">—</b></div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal('cancel')">保留订单</button>
    <button class="btn btn-danger" onclick="confirmCancel()">取消订单</button>
  </div>
</div>

<div class="toast"></div>
<script src="../assets/app.js"></script>
<script>
let pending = null;

function render(status) {
  const rows = MOCK.orders.filter(o => status === 'ALL' || o.status === status);
  document.getElementById('rows').innerHTML = rows.map(o => {
    const refunded = o.status === 'CANCELLED';
    return `<tr>
      <td class="mono">${o.id}</td>
      <td><span style="font-size:16px">${o.icon}</span> <span class="t-strong">${o.goods}</span></td>
      <td class="r num">${o.qty}</td>
      <td class="r num" style="color:${refunded ? 'var(--green-600)' : 'var(--ink-700)'};font-weight:600">
        ${refunded ? '+' + fmt(o.pts) + ' 已退还' : '−' + fmt(o.pts)}
      </td>
      <td>${stateTag(o.status)}</td>
      <td class="num" style="color:var(--ink-500)">${o.time}</td>
      <td>${o.status === 'CREATED'
        ? `<button class="btn btn-secondary btn-sm" onclick="askCancel('${o.id}', ${o.pts})">取消订单</button>`
        : '<span style="color:var(--ink-400);font-size:13px">—</span>'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="empty"><span class="ico">📭</span>暂无相关订单</td></tr>';
}

function askCancel(id, pts) {
  pending = id;
  document.getElementById('cancelId').textContent = id;
  document.getElementById('cancelPts').textContent = '+' + fmt(pts) + ' 分';
  openModal('cancel');
}
function confirmCancel() {
  closeModal('cancel');
  const o = MOCK.orders.find(x => x.id === pending);
  if (o) { o.status = 'CANCELLED'; o.statusName = '已取消'; }
  toast('订单已取消，积分已退还');
  render(document.querySelector('#seg .on').dataset.value);
}
bindSeg('#seg', render);
render('ALL');
</script>
</body>
</html>
