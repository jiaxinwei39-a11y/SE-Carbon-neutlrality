<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>积分商城 · 绿行积分</title>
<link rel="stylesheet" href="../assets/web.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="mark">🌿</span> 绿行积分</div>
    <nav class="nav">
      <a href="index.html">首页</a><a href="trips.html">行程</a>
      <a href="points.html">积分</a><a class="on" href="mall.html">商城</a><a href="orders.html">订单</a>
    </nav>
    <div class="right">
      <div class="pill">🌿 <span class="num" id="navPoints">1,280</span> 分</div>
      <div class="avatar">生</div>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>积分商城</h1>
      <p>礼品按所需积分从低到高排列 · 每日兑换次数与库存均由服务端校验</p>
    </div>
    <div class="filters" style="margin:0">
      <select class="select" style="width:130px"><option>全部礼品</option><option>生活用品</option><option>出行权益</option><option>公益</option></select>
      <input class="input" placeholder="搜索礼品" style="width:180px">
    </div>
  </div>

  <div class="balance-strip">
    <span>可用积分</span>
    <strong class="num">1,280</strong>
    <span style="opacity:.75">分</span>
    <div class="spacer"></div>
    <a href="orders.html" style="color:var(--green-700);font-weight:600">我的兑换记录 →</a>
  </div>

  <div class="grid-goods" id="goods"></div>

  <p class="hint" style="margin-top:20px">
    提示：兑换成功后积分立即扣减，礼品在「我的订单」中查看；库存不足或积分不足时按钮不可点击，具体原因会显示在卡片下方。
  </p>
</main>

<div class="toast"></div>
<script src="../assets/app.js"></script>
<script>
const POINTS = 1280;
document.getElementById('goods').innerHTML = MOCK.goods.map(g => {
  const lack = g.cost > POINTS;
  const sold = g.stock === 0;
  const reason = sold ? '暂时缺货' : lack ? `还差 ${g.cost - POINTS} 分` : `库存 ${g.stock}`;
  return `
  <a class="goods ${sold ? 'disabled' : ''}" href="${sold ? 'javascript:void 0' : 'product.html'}">
    <div class="cover">${g.icon}</div>
    <div class="info">
      <div class="name">${g.name}</div>
      <div style="min-height:22px;display:flex;gap:6px">
        ${lack ? '<span class="tag tag-amber">积分不足</span>' : ''}
        ${sold ? '<span class="tag tag-gray">已兑完</span>' : ''}
        ${(!lack && !sold) ? '<span class="tag tag-green">可兑换</span>' : ''}
      </div>
      <div class="foot">
        <span class="price num">${fmt(g.cost)}<small>分</small></span>
        <span class="stock">${reason}</span>
      </div>
    </div>
  </a>`;
}).join('');
</script>
</body>
</html>
