<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单处理 · 绿行积分管理端</title>
<link rel="stylesheet" href="../assets/web.css">
</head>
<body>
<div class="admin">
  <aside class="sidebar">
    <div class="brand"><span class="mark">🌿</span> 绿行积分 · 运营端</div>
    <nav>
      <a href="dashboard.html">📊 运营概览</a>
      <a href="rules.html">⚙️ 碳核算规则</a>
      <a href="products.html">🎁 礼品与库存</a>
      <a class="on" href="orders.html">📦 订单处理</a>
      <a href="users.html">👥 用户管理</a>
    </nav>
    <div class="foot"><div class="avatar" style="width:28px;height:28px;font-size:11px">管</div> 管理员 admin</div>
  </aside>

  <main class="admin-main">
    <div class="admin-top">
      <div>
        <div class="crumb">管理端 / <b>订单处理</b></div>
        <h1>订单处理</h1>
        <p>待处理 →（履约）已履约；取消需在履约前操作，积分与库存同步冲正</p>
      </div>
      <div style="display:flex;gap:10px">
        <span class="tag tag-amber">待处理 2</span>
        <span class="tag tag-green">已履约 1</span>
        <span class="tag tag-gray">已取消 1</span>
      </div>
    </div>

    <div class="filters">
      <select class="select" style="width:130px" id="statusSel">
        <option value="ALL">全部状态</option>
        <option value="CREATED">待处理</option>
        <option value="FULFILLED">已履约</option>
        <option value="CANCELLED">已取消</option>
      </select>
      <input class="input" id="kw" placeholder="搜索订单号 / 用户名" style="width:240px">
      <div class="spacer"></div>
      <span class="hint">共 4 笔</span>
    </div>

    <section class="card tight">
      <table class="table">
        <thead><tr><th style="width:190px">订单号</th><th>用户</th><th>礼品</th><th class="r" style="width:100px">扣减积分</th><th style="width:110px">状态</th><th style="width:150px">下单时间</th><th style="width:170px">操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <div class="notice" style="margin-top:18px">
      <b>为什么不能重复处理？</b>履约与取消都带状态机校验（仅 <span class="mono">CREATED</span> 可流转），并发下用乐观锁版本号防止重复扣减。
    </div>
  </main>
</div>

<div class="mask" id="mask" onclick="closeModal('act')"></div>
<div class="modal" id="act">
  <h3 id="actTitle">确认履约</h3>
  <p class="m-sub" id="actSub">履约后订单不可撤销，礼品将线下发放给用户。</p>
  <div class="confirm-row"><span>订单号</span><b class="mono" id="actId">—</b></div>
  <div class="confirm-row" style="border-bottom:0"><span>用户</span><b id="actUser">—</b></div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal('act')">取消</button>
    <button class="btn btn-primary" id="actOk">确认</button>
  </div>
</div>

<div class="toast"></div>
<script src="../assets/app.js"></script>
<script>
let target = null, action = null;

function render() {
  const st = document.getElementById('statusSel').value;
  const kw = document.getElementById('kw').value.trim();
  const rows = MOCK.orders.filter(o =>
    (st === 'ALL' || o.status === st) &&
    (!kw || o.id.includes(kw) || o.user.includes(kw)));
  document.getElementById('rows').innerHTML = rows.map(o => `
    <tr>
      <td class="mono">${o.id}</td>
      <td class="t-strong">${o.user}</td>
      <td>${o.icon} ${o.goods}</td>
      <td class="r num">${o.pts}</td>
      <td>${stateTag(o.status)}</td>
      <td class="num" style="color:var(--ink-500)">${o.time}</td>
      <td>${o.status === 'CREATED'
        ? `<button class="btn btn-primary btn-sm" onclick="ask('${o.id}','FULFILLED')">履约</button>
           <button class="btn btn-secondary btn-sm" onclick="ask('${o.id}','CANCELLED')">取消</button>`
        : '<span style="color:var(--ink-400);font-size:13px">—</span>'}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="empty"><span class="ico">📭</span>没有符合条件的订单</td></tr>';
}

function ask(id, act) {
  target = id; action = act;
  const o = MOCK.orders.find(x => x.id === id);
  document.getElementById('actTitle').textContent = act === 'FULFILLED' ? '确认履约' : '确认取消订单';
  document.getElementById('actSub').textContent = act === 'FULFILLED'
    ? '履约后订单不可撤销，礼品将线下发放给用户。'
    : '取消后积分立即退还并归还库存，该操作不可撤销。';
  document.getElementById('actId').textContent = id;
  document.getElementById('actUser').textContent = o.user;
  const ok = document.getElementById('actOk');
  ok.className = act === 'FULFILLED' ? 'btn btn-primary' : 'btn btn-danger';
  ok.textContent = act === 'FULFILLED' ? '确认履约' : '确认取消';
  openModal('act');
}
document.getElementById('actOk').addEventListener('click', () => {
  const o = MOCK.orders.find(x => x.id === target);
  if (o) { o.status = action; o.statusName = action === 'FULFILLED' ? '已履约' : '已取消'; }
  closeModal('act');
  toast(action === 'FULFILLED' ? '订单已履约' : '订单已取消，积分已退还');
  render();
});
document.getElementById('statusSel').addEventListener('change', render);
document.getElementById('kw').addEventListener('input', render);
render();
</script>
</body>
</html>
